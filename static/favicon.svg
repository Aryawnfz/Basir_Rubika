<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0a1420"/>
      <stop offset="100%" stop-color="#050b16"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5ec4ff"/>
      <stop offset="55%"  stop-color="#12a4ff"/>
      <stop offset="100%" stop-color="#f0c040"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="none" stroke="#12a4ff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- لوزیِ برند «بصیر» — همان نمادِ ◈ استفاده‌شده در ناوبار -->
  <g transform="translate(32,32)">
    <rect x="-17" y="-17" width="34" height="34" rx="6"
          transform="rotate(45)" fill="url(#diamond)"/>
    <rect x="-6" y="-6" width="12" height="12" rx="2.5"
          transform="rotate(45)" fill="#050b16"/>
  </g>
</svg>
