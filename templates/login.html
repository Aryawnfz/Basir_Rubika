{% extends "base.html" %}
{% block title %}ورود – بصیر{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card">

    <div class="login-header">
      <div class="login-logo">◈</div>
      <h1 class="login-title">بصیر</h1>
      <p class="login-sub">پلتفرم هوشمند جستجو در روبیکا</p>
    </div>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" class="login-form">
      <div class="form-group">
        <label for="username">نام کاربری</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="نام کاربری خود را وارد کنید"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">رمز عبور</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="رمز عبور خود را وارد کنید"
            autocomplete="current-password"
            required
          />
          <button type="button" class="eye-btn" onclick="togglePass()">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login">ورود به بصیر</button>
    </form>

    <p class="login-footer">سیستم جستجوی چند‌اکانته روبیکا</p>
  </div>
</div>

<script>
function togglePass() {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
