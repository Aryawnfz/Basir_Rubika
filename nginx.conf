# ── Nginx config برای بصیر (روبیکا) ────────────────────────────────────────────────────
# این فایل رو در /etc/nginx/sites-available/basir بذار
# بعد: sudo ln -s /etc/nginx/sites-available/basir /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name 202.133.89.193;   # ← آیپی یا دامنه سرورت

    # برای HTTPS با certbot: sudo certbot --nginx -d your-domain.com

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # timeout برای Playwright جستجو (مهم!)
        proxy_read_timeout    10000s;
        proxy_connect_timeout 10000s;
        proxy_send_timeout    10000s;

        # SSE / polling بدون buffering
        proxy_buffering off;
    }

    # فایل‌های static رو مستقیم nginx بده
    location /static/ {
        alias /Basir/basir/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # حداکثر حجم upload (برای آینده)
    client_max_body_size 10M;
}